[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]

[profile.opt-dev]
inherits = "dev"
opt-level = 1

[workspace.package]
version = "0.6.1"
edition = "2024"
homepage = "https://www.pola.rs/"
license = "MIT"
publish = false
repository = "https://github.com/pola-rs/polars-cloud-client"

[workspace.lints.clippy]
disallowed_methods = "deny"

[workspace.dependencies]
anyhow = "1.0.95"
async-trait = "0.1"
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
client-cli = { path = "crates/cli" }
client-core = { path = "crates/core" }
comfy-table = "7.2"
directories = "6.0.0"
mockall = "0.13.1"
pc-observatory-models = { path = "../contracts/crates/pc-observatory-models" }
polars-axum-models = { path = "../contracts/crates/axum-models", features = ["pyo3"] }
polars-backend-client = { path = "../contracts/crates/control-plane-client", features = ["pyo3"] }
protos-client-compute = { path = "../contracts/crates/protos-client-compute" }
protos-client-control = { path = "../contracts/crates/protos-client-control" }
protos-common = { path = "../contracts/crates/protos-common" }
pyo3 = { version = "0.28.0", features = ["abi3-py310", "multiple-pymethods", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
reqwest-middleware = "0.4.1"
reqwest-retry = "0.7.0"
rstest = "0.25.0"
serde = { version = "1.0" }
serde_json = "1.0"
testresult = "0.4.1"
thiserror = "2.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "signal"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utils = { path = "../contracts/crates/utils" }
uuid = "1.11.0"
webbrowser = "1.0.3"

[profile.mindebug-dev]
inherits = "dev"
debug = "line-tables-only"

[profile.release]
lto = "thin"
debug = "line-tables-only"

[profile.nodebug-release]
inherits = "release"
debug = false

[profile.debug-release]
inherits = "release"
debug = true

[profile.dist-release]
inherits = "release"
codegen-units = 1
debug = false
lto = "fat"
