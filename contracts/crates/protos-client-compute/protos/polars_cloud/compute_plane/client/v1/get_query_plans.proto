syntax = "proto3";

package polars_cloud.compute_plane.client.v1;

import "google/protobuf/field_mask.proto";
import "polars_cloud/common/query_id.proto";
import "polars_cloud/common/query_plans.proto";

message GetQueryPlansRequest {
  polars_cloud.common.QueryId query_id = 1;
  google.protobuf.FieldMask fields = 2;
}

// Unlike `polars_cloud.common.QueryPlans`, which the control plane stores as
// rendered text, clients render the stage graph themselves.
message ClientQueryPlans {
  // The format `ir_plan` is rendered in.
  polars_cloud.common.PlanFormat format = 1;
  optional string ir_plan = 2;
  // StageGraphVisualizationData encoded with MessagePack.
  optional bytes stage_graph = 3;
}

message GetQueryPlansResponse {
  reserved 1; // was: polars_cloud.common.QueryPlans

  ClientQueryPlans plans = 2;
}
