[workspace]
resolver = "2"
members = [
  "crates/*",
]
default-members = [
  "crates/*",
]
[workspace.metadata.cargo-shear]
ignored = ["prost-types", "strum", "tonic-prost"]

[workspace.dependencies]
aide = { version = "0.15.1", features = ["axum-json", "macros", "axum-query"] }
anyhow = "1.0.95"
async-trait = { version = "0.1" }
axum = { version = "0.8.4", default-features = false, features = ["matched-path"] }
build-deps = { path = "crates/build-deps" }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = { version = "0.3.31" }
garde = { version = "0.22.0", features = ["derive", "email", "regex"] }
http = "1.1"
opentelemetry-semantic-conventions = { version = "0.31.0" }
pc-observatory-database = { path = "crates/pc-observatory-database" }
pc-observatory-models = { path = "crates/pc-observatory-models" }
pc-observatory-types = { path = "crates/pc-observatory-types" }
polars-api-error = { path = "crates/polars-api-error" }
polars-axum-models = { path = "crates/axum-models" }
polars-rest = { path = "crates/polars-rest" }
prost = "0.14.3"
prost-types = "0.14.3"
protos-client-compute = { path = "crates/protos-client-compute" }
protos-common = { path = "crates/protos-common" }
protos-compute-internal = { path = "crates/protos-compute-internal" }
pyo3 = { version = "0.28.0", features = ["abi3-py310", "chrono", "uuid"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
regex = { version = "1.11" }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2"] }
reqwest-middleware = "0.4.1"
rmp-serde = "1.3.0"
schemars = { version = "0.9.0", features = ["uuid1", "chrono04"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "chrono", "uuid"] }
strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0"
tokio = { version = "1.0", default-features = false }
tonic = { version = "0.14.3", features = ["transport", "codegen", "tls-native-roots", "zstd"] }
tonic-prost = "0.14.3"
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors", "trace", "request-id"] }
tracing = "0.1.41"
trait-variant = "0.1.2"
uuid = { version = "1.8.0", features = ["v4", "v7", "serde"] }
version-number = { path = "crates/version-number" }

[workspace.package]
version = "0.39.2"
edition = "2024"
homepage = "https://www.pola.rs/"
license = "MIT"
repository = "https://github.com/pola-rs/polars-cloud-client"

[workspace.lints.clippy]
needless_return = "allow"
